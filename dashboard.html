<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJLink Beamer Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .connection-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group input {
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 18px;
            text-align: center;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .status-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .status-card.online {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .status-card.offline {
            border-color: #f44336;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.3);
        }

        .control-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
        }

        .control-group h3 {
            margin-bottom: 20px;
            color: #ffd700;
            text-align: center;
            font-size: 1.3em;
        }

        button {
            width: 100%;
            padding: 15px 20px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .power-on {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            font-size: 20px;
            padding: 18px;
        }

        .power-off {
            background: linear-gradient(45deg, #f44336, #da190b);
            color: white;
            font-size: 20px;
            padding: 18px;
        }

        .input-btn {
            background: linear-gradient(45deg, #2196F3, #0b7dda);
            color: white;
        }

        .mute-btn {
            background: linear-gradient(45deg, #FF9800, #e68900);
            color: white;
        }

        .connect-btn {
            background: linear-gradient(45deg, #9C27B0, #7b1fa2);
            color: white;
            font-size: 20px;
            padding: 18px;
        }

        .refresh-btn {
            background: linear-gradient(45deg, #607D8B, #455a64);
            color: white;
        }

        select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 18px;
        }

        select option {
            background: #1e3c72;
            color: white;
        }

        .log-section {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
        }

        .log {
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
        }

        .log div {
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 3px;
        }

        .log .info { background: rgba(33, 150, 243, 0.2); }
        .log .error { background: rgba(244, 67, 54, 0.2); }
        .log .success { background: rgba(76, 175, 80, 0.2); }

        .device-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .large-text {
            font-size: 1.1em;
            font-weight: bold;
        }

        .scan-btn {
            background: linear-gradient(45deg, #009688, #00695c);
            color: white;
        }

        .scan-results {
            margin-top: 15px;
        }

        .scan-result-item {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scan-result-item:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(5px);
        }

        .scan-result-item .device-host {
            font-weight: bold;
            font-size: 1.05em;
        }

        .scan-result-item .device-name {
            opacity: 0.8;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Beamer Steuerung</h1>

        <div class="connection-section">
            <h3>Beamer Verbindung</h3>
            <div class="input-group">
                <input type="text" id="host" placeholder="IP-Adresse (z.B. 192.168.1.100)" value="192.168.1.100">
                <input type="number" id="port" placeholder="Port (4352)" value="4352">
                <input type="text" id="password" placeholder="Passwort (optional)">
            </div>
            <button class="connect-btn" onclick="connect()" id="connectBtn">Mit Beamer Verbinden</button>
            <button class="scan-btn" onclick="scanNetwork()" id="scanBtn">🔍 Netzwerk nach Beamern durchsuchen</button>

            <div class="scan-results" id="scanResults"></div>

            <div class="device-info" id="deviceInfo" style="display: none;">
                <div id="deviceDetails"></div>
            </div>
        </div>

        <div class="status-section">
            <div class="status-card" id="connectionStatus">
                <h3>Verbindung</h3>
                <p class="large-text" id="statusText">Nicht verbunden</p>
            </div>
            <div class="status-card" id="powerStatus">
                <h3>Power Status</h3>
                <p class="large-text" id="powerText">Unbekannt</p>
            </div>
            <div class="status-card" id="inputStatus">
                <h3>Aktueller Input</h3>
                <p class="large-text" id="inputText">Unbekannt</p>
            </div>
            <div class="status-card" id="muteStatus">
                <h3>Mute Status</h3>
                <p class="large-text" id="muteText">Unbekannt</p>
            </div>
        </div>

        <div class="control-section">
            <div class="control-group">
                <h3>⚡ Ein/Aus</h3>
                <button class="power-on" onclick="powerOn()" id="powerOnBtn" disabled>🟢 Beamer Einschalten</button>
                <button class="power-off" onclick="powerOff()" id="powerOffBtn" disabled>🔴 Beamer Ausschalten</button>
                <button class="refresh-btn" onclick="updateAllStatus()" id="updateBtn" disabled>🔄 Status Aktualisieren</button>
            </div>

            <div class="control-group">
                <h3>📺 Bildquelle</h3>
                <select id="inputSelect" disabled>
                    <option value="">Bildquelle wählen...</option>
                    <option value="11">HDMI 1</option>
                    <option value="12">HDMI 2</option>
                    <option value="21">Video 1</option>
                    <option value="22">Video 2</option>
                    <option value="31">DVI/Digital 1</option>
                    <option value="32">DVI/Digital 2</option>
                    <option value="41">USB/Storage</option>
                    <option value="51">Netzwerk</option>
                </select>
                <button class="input-btn" onclick="setInput()" id="setInputBtn" disabled>📺 Bildquelle Setzen</button>
                <button class="refresh-btn" onclick="loadAvailableInputs()" id="loadInputsBtn" disabled>🔄 Verfügbare Quellen Laden</button>
            </div>

            <div class="control-group">
                <h3>🔇 Stummschaltung</h3>
                <button class="mute-btn" onclick="muteAll()" id="muteAllBtn" disabled>🔇 Alles Stumm</button>
                <button class="mute-btn" onclick="muteVideo()" id="muteVideoBtn" disabled>📵 Video Stumm</button>
                <button class="mute-btn" onclick="muteAudio()" id="muteAudioBtn" disabled>🔊 Audio Stumm</button>
                <button class="refresh-btn" onclick="unmuteAll()" id="unmuteBtn" disabled>🔊 Stummschaltung Aufheben</button>
            </div>
        </div>

        <div class="log-section">
            <h3>📝 Aktivitätsprotokoll</h3>
            <div class="log" id="logContainer"></div>
        </div>
    </div>

    <script>
        let isConnected = false;
        let lastInputCode = null; // letzte verwendete Bildquelle (gespeichert)

        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString('de-DE');
            const logEntry = document.createElement('div');
            logEntry.className = type;
            logEntry.innerHTML = `[${timestamp}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;

            while (logContainer.children.length > 50) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        function updateConnectionStatus(status, text) {
            const statusCard = document.getElementById('connectionStatus');
            const statusText = document.getElementById('statusText');

            statusCard.className = `status-card ${status}`;
            statusText.textContent = text;
        }

        function updateStatus(elementId, text) {
            const element = document.getElementById(elementId);
            if (element) {
                element.textContent = text;
            }
        }

        function setButtonsEnabled(enabled) {
            const ids = [
                'powerOnBtn', 'powerOffBtn', 'updateBtn',
                'setInputBtn', 'loadInputsBtn',
                'muteAllBtn', 'muteVideoBtn', 'muteAudioBtn', 'unmuteBtn'
            ];
            ids.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.disabled = !enabled;
            });
            const inputSelect = document.getElementById('inputSelect');
            if (inputSelect) inputSelect.disabled = !enabled;
        }

        async function connect() {
            const host = document.getElementById('host').value.trim();
            const port = parseInt(document.getElementById('port').value);
            const password = document.getElementById('password').value.trim();

            if (!host || !port) {
                log('Bitte IP-Adresse und Port eingeben', 'error');
                return;
            }

            try {
                log(`Verbinde zu Beamer ${host}:${port}...`, 'info');

                await window.pjlinkAPI.connect({
                    host: host,
                    port: port,
                    password: password || null
                });

                isConnected = true;
                updateConnectionStatus('online', 'Verbunden');
                setButtonsEnabled(true);
                log('✅ Erfolgreich mit Beamer verbunden', 'success');
                saveCurrentSettings();

                try {
                    const deviceInfo = await window.pjlinkAPI.getDeviceInfo();
                    showDeviceInfo(deviceInfo);
                } catch (e) {
                    log('Geräteinformationen konnten nicht geladen werden', 'error');
                }

                setTimeout(() => {
                    updateAllStatus();
                    loadAvailableInputs();
                }, 1000);

            } catch (error) {
                isConnected = false;
                updateConnectionStatus('offline', 'Verbindung fehlgeschlagen');
                setButtonsEnabled(false);
                log(`❌ Verbindung fehlgeschlagen: ${error.message}`, 'error');
            }
        }

        function showDeviceInfo(info) {
            const deviceInfo = document.getElementById('deviceInfo');
            const deviceDetails = document.getElementById('deviceDetails');

            deviceDetails.innerHTML = `
                <strong>Gerät:</strong> ${info.manufacturer} ${info.model}<br>
                <strong>Name:</strong> ${info.name}
            `;
            deviceInfo.style.display = 'block';
        }

        async function powerOn() {
            if (!isConnected) {
                log('❌ Nicht mit Beamer verbunden', 'error');
                return;
            }
            try {
                log('🟢 Sende Einschalt-Befehl...', 'info');
                await window.pjlinkAPI.powerOn();
                log('✅ Befehl vom Beamer bestätigt (ACK) – warte auf tatsächlichen Zustand...', 'success');
                pollPowerState('Ein', 1);
            } catch (error) {
                log(`❌ Fehler beim Einschalten: ${error.message}`, 'error');
            }
        }

        // Fragt den Power-Status mehrfach ab, da viele Beamer 15-30s zum Hochfahren brauchen.
        // Zeigt jeden Zwischenstand im Log, damit man sieht ob er wirklich hochfährt oder auf "Aus" hängen bleibt.
        async function pollPowerState(expectedStateName, attempt) {
            const maxAttempts = 10; // 10 x 3s = 30s
            if (!isConnected) return;

            try {
                const powerState = await window.pjlinkAPI.getPowerState();
                updateStatus('powerText', powerState.description);
                log(`🔄 Status (Versuch ${attempt}/${maxAttempts}): ${powerState.description}`, 'info');

                if (powerState.description === expectedStateName) {
                    log(`✅ Zielzustand erreicht: ${expectedStateName}`, 'success');
                    updateAllStatus();
                    return;
                }
            } catch (error) {
                log(`⚠️ Status-Abfrage fehlgeschlagen (Versuch ${attempt}): ${error.message}`, 'error');
            }

            if (attempt < maxAttempts) {
                setTimeout(() => pollPowerState(expectedStateName, attempt + 1), 3000);
            } else {
                log(`❌ Beamer hat nach 30s nicht "${expectedStateName}" gemeldet. Prüfen Sie, ob der Beamer physisch reagiert (Lüfter/LED) und ob "Netzwerk im Standby" im Beamer-Menü aktiviert ist.`, 'error');
            }
        }

        async function powerOff() {
            if (!isConnected) {
                log('❌ Nicht mit Beamer verbunden', 'error');
                return;
            }

            if (!confirm('Beamer wirklich ausschalten?')) {
                return;
            }

            try {
                log('🔴 Sende Ausschalt-Befehl...', 'info');
                await window.pjlinkAPI.powerOff();
                log('✅ Befehl vom Beamer bestätigt (ACK) – warte auf tatsächlichen Zustand...', 'success');
                pollPowerState('Aus', 1);
            } catch (error) {
                log(`❌ Fehler beim Ausschalten: ${error.message}`, 'error');
            }
        }

        async function updateAllStatus() {
            if (!isConnected) return;

            try {
                const powerState = await window.pjlinkAPI.getPowerState();
                updateStatus('powerText', powerState.description);
                log(`Power: ${powerState.description}`, 'info');

                const currentInput = await window.pjlinkAPI.getCurrentInput();
                const inputText = (currentInput && (currentInput.name || `${currentInput.source}-${currentInput.channel}`)) || 'Unbekannt';
                updateStatus('inputText', inputText);

                const muteState = await window.pjlinkAPI.getMuteState();
                let muteText = '';
                if (muteState.video && muteState.audio) {
                    muteText = 'Video + Audio stumm';
                } else if (muteState.video) {
                    muteText = 'Video stumm';
                } else if (muteState.audio) {
                    muteText = 'Audio stumm';
                } else {
                    muteText = 'Nicht stumm';
                }
                updateStatus('muteText', muteText);

            } catch (error) {
                log(`❌ Status-Update fehlgeschlagen: ${error.message}`, 'error');
            }
        }

        async function setInput() {
            if (!isConnected) {
                log('❌ Nicht mit Beamer verbunden', 'error');
                return;
            }

            const inputSelect = document.getElementById('inputSelect');
            const selectedInput = inputSelect.value;

            if (!selectedInput) {
                log('❌ Bitte eine Bildquelle auswählen', 'error');
                return;
            }

            try {
                log(`📺 Setze Bildquelle auf ${inputSelect.options[inputSelect.selectedIndex].text}...`, 'info');
                await window.pjlinkAPI.setInput(selectedInput);
                log('✅ Bildquelle erfolgreich gesetzt', 'success');
                lastInputCode = selectedInput;
                saveCurrentSettings();
                setTimeout(() => updateAllStatus(), 2000);
            } catch (error) {
                log(`❌ Fehler beim Setzen der Bildquelle: ${error.message}`, 'error');
            }
        }

        async function loadAvailableInputs() {
            if (!isConnected) return;

            try {
                const result = await window.pjlinkAPI.getAvailableInputs();
                const inputSelect = document.getElementById('inputSelect');

                inputSelect.innerHTML = '<option value="">Bildquelle wählen...</option>';

                result.inputs.forEach(input => {
                    const option = document.createElement('option');
                    option.value = input.code;
                    option.textContent = input.name;
                    inputSelect.appendChild(option);
                });

                if (lastInputCode) {
                    const optionExists = Array.from(inputSelect.options).some(o => o.value === lastInputCode);
                    if (optionExists) {
                        inputSelect.value = lastInputCode;
                        log('💾 Letzte Bildquelle vorausgewählt (zum Anwenden auf "Bildquelle Setzen" klicken)', 'info');
                    }
                }

                log(`✅ ${result.inputs.length} verfügbare Bildquellen geladen`, 'success');
            } catch (error) {
                log(`❌ Fehler beim Laden der Bildquellen: ${error.message}`, 'error');
            }
        }

        async function muteAll() {
            if (!isConnected) { log('❌ Nicht mit Beamer verbunden', 'error'); return; }
            try {
                await window.pjlinkAPI.setMute({ video: true, audio: true });
                log('✅ Vollständige Stummschaltung aktiviert', 'success');
                setTimeout(() => updateAllStatus(), 1000);
            } catch (error) {
                log(`❌ Fehler bei Stummschaltung: ${error.message}`, 'error');
            }
        }

        async function muteVideo() {
            if (!isConnected) { log('❌ Nicht mit Beamer verbunden', 'error'); return; }
            try {
                await window.pjlinkAPI.setMute({ video: true, audio: false });
                log('✅ Video-Stummschaltung aktiviert', 'success');
                setTimeout(() => updateAllStatus(), 1000);
            } catch (error) {
                log(`❌ Fehler bei Video-Stummschaltung: ${error.message}`, 'error');
            }
        }

        async function muteAudio() {
            if (!isConnected) { log('❌ Nicht mit Beamer verbunden', 'error'); return; }
            try {
                await window.pjlinkAPI.setMute({ video: false, audio: true });
                log('✅ Audio-Stummschaltung aktiviert', 'success');
                setTimeout(() => updateAllStatus(), 1000);
            } catch (error) {
                log(`❌ Fehler bei Audio-Stummschaltung: ${error.message}`, 'error');
            }
        }

        async function unmuteAll() {
            if (!isConnected) { log('❌ Nicht mit Beamer verbunden', 'error'); return; }
            try {
                await window.pjlinkAPI.setMute({ video: false, audio: false });
                log('✅ Alle Stummschaltungen aufgehoben', 'success');
                setTimeout(() => updateAllStatus(), 1000);
            } catch (error) {
                log(`❌ Fehler beim Aufheben der Stummschaltung: ${error.message}`, 'error');
            }
        }

        // ============ EINSTELLUNGEN SPEICHERN/LADEN ============

        async function loadSavedSettings() {
            try {
                const settings = await window.pjlinkAPI.loadSettings();
                if (settings) {
                    if (settings.host) document.getElementById('host').value = settings.host;
                    if (settings.port) document.getElementById('port').value = settings.port;
                    if (settings.password) document.getElementById('password').value = settings.password;
                    if (settings.lastInputCode) lastInputCode = settings.lastInputCode;
                    log('💾 Letzte Verbindungseinstellungen geladen', 'info');
                }
            } catch (error) {
                // Keine gespeicherten Einstellungen vorhanden - einfach ignorieren
            }
        }

        function saveCurrentSettings() {
            const host = document.getElementById('host').value.trim();
            const port = parseInt(document.getElementById('port').value);
            const password = document.getElementById('password').value.trim();

            window.pjlinkAPI.saveSettings({
                host: host,
                port: port,
                password: password || null,
                lastInputCode: lastInputCode
            }).catch(() => {
                // Speichern fehlgeschlagen - nicht kritisch für die Bedienung
            });
        }

        // ============ NETZWERK SCANNER ============

        async function scanNetwork() {
            const scanBtn = document.getElementById('scanBtn');
            const resultsDiv = document.getElementById('scanResults');

            scanBtn.disabled = true;
            scanBtn.textContent = '🔍 Suche läuft... (kann bis zu 30s dauern)';
            resultsDiv.innerHTML = '';
            log('🔍 Durchsuche Netzwerk nach PJLink-Beamern (Port 4352)...', 'info');

            try {
                const result = await window.pjlinkAPI.scanNetwork();

                if (!result.devices || result.devices.length === 0) {
                    log('ℹ️ Keine Beamer gefunden. Ist der Beamer eingeschaltet, PJLink aktiviert und im gleichen Netzwerk?', 'info');
                } else {
                    log(`✅ ${result.devices.length} Gerät(e) gefunden`, 'success');
                    result.devices.forEach(device => {
                        const item = document.createElement('div');
                        item.className = 'scan-result-item';
                        item.innerHTML = `
                            <span class="device-host">${device.host}</span>
                            <span class="device-name">${device.name ? device.name : 'PJLink-Gerät (Name unbekannt)'}</span>
                        `;
                        item.onclick = () => {
                            document.getElementById('host').value = device.host;
                            document.getElementById('port').value = device.port;
                            log(`📌 ${device.host} übernommen – jetzt auf "Mit Beamer Verbinden" klicken`, 'info');
                        };
                        resultsDiv.appendChild(item);
                    });
                }
            } catch (error) {
                log(`❌ Netzwerk-Suche fehlgeschlagen: ${error.message}`, 'error');
            } finally {
                scanBtn.disabled = false;
                scanBtn.textContent = '🔍 Netzwerk nach Beamern durchsuchen';
            }
        }

        window.addEventListener('load', function() {
            log('🎥 Beamer Dashboard gestartet', 'success');
            log('💡 IP-Adresse eingeben und auf "Verbinden" klicken', 'info');
            setButtonsEnabled(false);
            loadSavedSettings();
        });

        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey) {
                switch(event.key) {
                    case '1':
                        event.preventDefault();
                        powerOn();
                        break;
                    case '2':
                        event.preventDefault();
                        powerOff();
                        break;
                    case 'r':
                        event.preventDefault();
                        updateAllStatus();
                        break;
                }
            }
        });
    </script>
</body>
</html>
